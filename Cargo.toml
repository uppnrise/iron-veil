[package]
name = "iron-veil"
version = "0.1.1"
edition = "2024"

[dependencies]
tokio = { version = "1.53", features = ["full"] }
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1.12"
tokio-util = { version = "0.7", features = ["codec", "net"] }
anyhow = "1.0"
thiserror = "2.0"
futures = "0.3.34"
fake = { version = "5.1.0", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
rand = "0.10.2"
rand_chacha = "0.10.0"
regex = "1.13.1"
serde_json = "1.0.151"
sha2 = "0.11"
axum = "0.8.9"
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
chrono = { version = "0.4.45", features = ["serde"] }
tokio-rustls = "0.26.5"
rustls = "0.23.43"
rustls-pemfile = "2.2.0"
rustls-platform-verifier = "0.7.0"

# PostgreSQL client for database scanning
tokio-postgres = "0.7"

# OpenTelemetry
opentelemetry = { version = "0.32", features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "metrics"] }
tracing-opentelemetry = "0.33"

# JWT Authentication
jsonwebtoken = { version = "11", features = ["rust_crypto"] }

# UUID for audit log entry IDs
uuid = { version = "1.26", features = ["v4"] }

# Prometheus Metrics
metrics = "0.24"
metrics-exporter-prometheus = "0.18"

# File watching for hot reload
notify = "8"

[dev-dependencies]
reqwest = { version = "0.13", features = ["json"] }
tempfile = "3"
