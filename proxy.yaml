# Iron Veil proxy configuration.
# See README.md for the full reference of every section.

masking_enabled: true

# Secret that keys the deterministic masking output (fake-data seeds and the
# `hash` strategy). Set this (or the IRONVEIL_MASKING_SECRET env var) so masked
# values are stable across restarts without being computable by anyone who
# lacks the secret. When unset, a random per-process key is used.
# masking_secret: change-me

# Explicit masking rules: table (optional) + column + strategy.
# Strategies: email, phone, address, name, text, credit_card, ssn, ip, dob,
# passport, hash, json.
rules:
- table: users
  column: email
  strategy: email
- table: users
  column: phone_number
  strategy: phone

# Heuristic (rule-less) detection for columns without an explicit rule.
# Only the listed detectors run. credit_card, ip, dob and passport are
# deliberately NOT enabled by default: they rewrite legitimate values
# (order numbers, host addresses, every date column) on real schemas.
heuristics:
  enabled: true
  types: [email, phone, ssn]

tls:
  enabled: false
  cert_path: certs/server.crt
  key_path: certs/server.key
upstream_tls: false
telemetry:
  enabled: false
  otlp_endpoint: http://localhost:4317
  service_name: iron-veil
# Management API: binds 127.0.0.1 unless api.bind is set. Binding a
# non-loopback address requires api_key or jwt_secret.
api: null
limits:
  max_connections: 1000
  upstream_pool_size: 100
  upstream_pool_wait_timeout_secs: 5
  connect_timeout_secs: 30
  idle_timeout_secs: 300
health_check:
  enabled: true
  interval_secs: 10
  timeout_secs: 5
  unhealthy_threshold: 3
  healthy_threshold: 1
audit:
  enabled: true
  log_to_stdout: true
  log_file: null
  rotation_enabled: true
  max_file_size_bytes: 10485760
  max_rotated_files: 5
  events: []
